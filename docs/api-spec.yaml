    UpdateAgentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
          nullable: true
        system_prompt:
          type: string
          maxLength: 10000
          nullable: true
        temperature:
          type: number
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
          minimum: 1
          maximum: 32000
        top_p:
          type: number
          minimum: 0
          maximum: 1
        config:
          type: object
          additionalProperties: true
        allowed_tools:
          type: array
          items:
            type: string

