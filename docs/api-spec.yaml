    AgentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentResponse'
      required: [data]

    CreateAgentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        provider:
          $ref: '#/components/schemas/ProviderType'
          default: qwen
        model_name:
          type: string
          minLength: 1
          maxLength: 100
        system_prompt:
          type: string
          maxLength: 10000
