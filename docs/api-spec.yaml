        max_tokens:
          type: integer
          minimum: 1
          nullable: true
        top_p:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        config:
          type: object
          additionalProperties: true
        allowed_tools:
          type: array
          items:
            type: string
        room_id:
          $ref: '#/components/schemas/UUID'
        created_by_id:
          $ref: '#/components/schemas/UUID'
        created_at:
          $ref: '#/components/schemas/Timestamp'
