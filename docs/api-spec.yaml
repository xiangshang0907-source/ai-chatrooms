openapi: 3.0.3
info:
  title: AI Chatrooms API
  description: 多智能体聊天室应用的 REST API
  version: 0.1.0
  contact:
    name: AI Chatrooms Team
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: 本地开发环境
  - url: https://api.ai-chatrooms.com
    description: 生产环境

tags:
  - name: health
    description: 健康检查
  - name: auth
    description: 认证授权
  - name: users
    description: 用户管理
  - name: rooms
    description: 房间管理
  - name: participants
    description: 参与者管理
  - name: agents
    description: AI代理管理
  - name: messages
    description: 消息管理
  - name: conversations
    description: 对话运行管理

paths:
  # 健康检查
  /health:
    get:
      tags: [health]
      summary: 健康检查
      operationId: health_check
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # 认证相关
  /auth/register:
    post:
      tags: [auth]
      summary: 用户注册
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [auth]
      summary: 用户登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新访问令牌
      operationId: refresh_token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # 用户相关
  /users/me:
    get:
      tags: [users]
      summary: 获取当前用户信息
      operationId: get_current_user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [users]
      summary: 更新当前用户信息
      operationId: update_current_user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # 房间相关
  /rooms:
    get:
      tags: [rooms]
      summary: 获取房间列表
      operationId: list_rooms
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RoomStatus'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [rooms]
      summary: 创建房间
      operationId: create_room
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rooms/{roomId}:
    get:
      tags: [rooms]
      summary: 获取房间详情
      operationId: get_room
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [rooms]
      summary: 更新房间配置
      operationId: update_room
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [rooms]
      summary: 删除房间
      operationId: delete_room
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 删除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # 参与者相关
  /rooms/{roomId}/participants:
    get:
      tags: [participants]
      summary: 获取房间参与者列表
      operationId: list_participants
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [participants]
      summary: 加入房间
      operationId: join_room
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRoomRequest'
      responses:
        '201':
          description: 加入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /rooms/{roomId}/participants/{participantId}:
    delete:
      tags: [participants]
      summary: 离开房间
      operationId: leave_room
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 离开成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # AI代理相关
  /rooms/{roomId}/agents:
    get:
      tags: [agents]
      summary: 获取房间AI代理列表
      operationId: list_agents
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [agents]
      summary: 创建AI代理
      operationId: create_agent
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rooms/{roomId}/agents/{agentId}:
    patch:
      tags: [agents]
      summary: 更新AI代理配置
      operationId: update_agent
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [agents]
      summary: 删除AI代理
      operationId: delete_agent
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 删除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # 消息相关
  /rooms/{roomId}/messages:
    get:
      tags: [messages]
      summary: 获取房间消息列表
      operationId: list_messages
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: after_sequence
          in: query
          description: 获取指定序号之后的消息
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [messages]
      summary: 发送消息
      operationId: send_message
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # 对话运行相关
  /rooms/{roomId}/conversations:
    get:
      tags: [conversations]
      summary: 获取房间对话运行列表
      operationId: list_conversations
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [conversations]
      summary: 开始新的对话运行
      operationId: start_conversation
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
      responses:
        '201':
          description: 开始成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rooms/{roomId}/conversations/{conversationId}/stop:
    post:
      tags: [conversations]
      summary: 停止对话运行
      operationId: stop_conversation
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 停止成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # 基础类型
    UUID:
      type: string
      format: uuid
      example: "123e4567-e89b-12d3-a456-426614174000"

    Timestamp:
      type: string
      format: date-time
      example: "2023-10-01T12:00:00Z"

    # 枚举类型
    UserStatus:
      type: string
      enum: [active, inactive, banned]

    UserRole:
      type: string
      enum: [user, admin]

    RoomStatus:
      type: string
      enum: [active, paused, archived]

    ParticipantType:
      type: string
      enum: [human, agent]

    ParticipantStatus:
      type: string
      enum: [active, inactive, muted]

    ProviderType:
      type: string
      enum: [qwen, openai, azure_openai, bedrock, local]

    MessageType:
      type: string
      enum: [text, system, error, tool_call, tool_result]

    MessageStatus:
      type: string
      enum: [sent, delivered, read, edited, deleted]

    RunStatus:
      type: string
      enum: [pending, running, paused, completed, failed, cancelled]

    # 响应模式
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        service:
          type: string
          example: "ai-chatrooms"
        version:
          type: string
          example: "0.1.0"
      required: [status, service, version]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: 错误代码
        message:
          type: string
          description: 错误描述
        details:
          type: object
          description: 详细错误信息
          additionalProperties: true
      required: [error, message]

    PaginationInfo:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
        has_next:
          type: boolean
        has_prev:
          type: boolean
      required: [page, size, total, pages, has_next, has_prev]

    # 认证相关
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_-]+$'
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128
        display_name:
          type: string
          maxLength: 100
      required: [username, email, password]

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: "bearer"
        expires_in:
          type: integer
          description: 访问令牌过期时间（秒）
        user:
          $ref: '#/components/schemas/UserResponse'
      required: [access_token, refresh_token, token_type, expires_in, user]

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: "bearer"
        expires_in:
          type: integer
      required: [access_token, token_type, expires_in]

    # 用户相关
    UserResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_login_at:
          $ref: '#/components/schemas/Timestamp'
          nullable: true
      required: [id, username, email, status, role, is_active, created_at]

    UpdateUserRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 100
          nullable: true
        avatar_url:
          type: string
          maxLength: 500
          nullable: true

    # 房间相关
    RoomResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/RoomStatus'
        max_participants:
          type: integer
        allow_user_interruption:
          type: boolean
        max_rounds_per_session:
          type: integer
        round_timeout_seconds:
          type: integer
        owner_id:
          $ref: '#/components/schemas/UUID'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required: [id, name, status, max_participants, allow_user_interruption, max_rounds_per_session, round_timeout_seconds, owner_id, created_at, updated_at]

    RoomDetailResponse:
      allOf:
        - $ref: '#/components/schemas/RoomResponse'
        - type: object
          properties:
            owner:
              $ref: '#/components/schemas/UserResponse'
            participants:
              type: array
              items:
                $ref: '#/components/schemas/ParticipantResponse'
            agents:
              type: array
              items:
                $ref: '#/components/schemas/AgentResponse'
            settings:
              type: object
              additionalProperties: true
          required: [owner, participants, agents]

    RoomListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RoomResponse'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
      required: [data, pagination]

    CreateRoomRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        max_participants:
          type: integer
          minimum: 2
          maximum: 50
          default: 10
        allow_user_interruption:
          type: boolean
          default: true
        max_rounds_per_session:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
        round_timeout_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 300
        settings:
          type: object
          additionalProperties: true
      required: [name]

    UpdateRoomRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
          nullable: true
        status:
          $ref: '#/components/schemas/RoomStatus'
        max_participants:
          type: integer
          minimum: 2
          maximum: 50
        allow_user_interruption:
          type: boolean
        max_rounds_per_session:
          type: integer
          minimum: 1
          maximum: 1000
        round_timeout_seconds:
          type: integer
          minimum: 30
          maximum: 3600
        settings:
          type: object
          additionalProperties: true

    # 参与者相关
    ParticipantResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        type:
          $ref: '#/components/schemas/ParticipantType'
        status:
          $ref: '#/components/schemas/ParticipantStatus'
        display_name:
          type: string
          nullable: true
        room_id:
          $ref: '#/components/schemas/UUID'
        user_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        agent_profile_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
