server {
    listen 80;
    server_name localhost;

    # Security headers (enterprise standard)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Enterprise API Gateway Pattern
    # Single location block handles ALL API routes
    location /api/ {
        # Rate limiting with burst capacity
        limit_req zone=api burst=50 nodelay;
        
        # Strip /api prefix and forward to backend
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend;
        
        # Include enterprise proxy configuration
        include proxy_params;
        
        # API-specific headers
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        
        # Enable CORS for API endpoints
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        # Structured logging for APIs
        access_log /var/log/nginx/api_access.log main;
        error_log /var/log/nginx/api_error.log warn;
    }

    # Special handling for Server-Sent Events (SSE)
    location ~* /api/.*stream$ {
        limit_req zone=api burst=10 nodelay;
        
        # Strip /api prefix
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend;
        
        # Include base proxy config
        include proxy_params;
        
        # SSE-specific overrides
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Cache-Control no-cache;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        
        # Authentication for streaming
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        
        # Extended timeout for long connections
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        
        # SSE headers
        add_header 'Cache-Control' 'no-cache';
        add_header 'Connection' 'keep-alive';
        add_header 'X-Accel-Buffering' 'no';
    }

    # Frontend application (Next.js)
    location / {
        proxy_pass http://frontend;
        include proxy_params;
        
        # Next.js specific settings
        proxy_set_header Accept-Encoding '';
        
        # Frontend logging
        access_log /var/log/nginx/frontend_access.log main;
    }

    # Static assets with aggressive caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Aggressive caching for static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        
        # Compression for static assets
        gzip_static on;
        
        # No access logging for static assets
        access_log off;
    }

    # API documentation (if using tools like Swagger)
    location /docs {
        proxy_pass http://backend/docs;
        include proxy_params;
    }

    # Metrics endpoint for monitoring
    location /metrics {
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://backend/metrics;
        include proxy_params;
    }
}