name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run basic tests (no PostgreSQL required)
        run: |
          cd backend
          # 只运行不依赖PostgreSQL的测试
          pytest tests/test_health.py tests/test_auth_simple.py -v
        env:
          TESTING: "1"
          
      - name: Set up database for full tests
        run: |
          cd backend
          # 等待 PostgreSQL 就绪
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "等待 PostgreSQL 启动..."
            sleep 2
          done
          # 创建测试数据库
          PGPASSWORD=postgres createdb -h localhost -U postgres ai_chatrooms_test
        env:
          PGPASSWORD: postgres
          
      - name: Run database migrations
        run: |
          cd backend
          python -m alembic upgrade head
        env:
          TESTING: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_chatrooms_test
          
      - name: Run PostgreSQL tests
        run: |
          cd backend
          # 运行所有需要PostgreSQL的测试（排除简单测试）
          pytest tests/ -v -k "not simple" --ignore=tests/test_health.py --ignore=tests/test_auth_simple.py
        env:
          TESTING: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_chatrooms_test
          
      - name: Test Summary
        run: |
          cd backend
          echo "=== 测试完成 ==="
          echo "基础测试：健康检查和简单认证逻辑"
          echo "完整测试：用户认证、房间管理、消息系统"
          echo "数据库：PostgreSQL 15"
          echo "Python版本：3.11"